[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-service"
version = "0.1.0"
description = "Session-aware iOS voice bridge for Hermes Agent"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.124,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "websockets>=15,<16", "pydantic>=2.10,<3", "python-dotenv>=1.1,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
luna-service = "luna.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["luna*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
